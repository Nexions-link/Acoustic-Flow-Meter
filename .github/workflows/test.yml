name: Test acoustic profile persistence
on:
  push:
    branches: [main]
    paths:
      - index.html
      - tests/**
      - .github/workflows/test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
